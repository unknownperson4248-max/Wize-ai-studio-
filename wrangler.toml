name = "wize-ai-studio"
main = "src/index.ts"
compatibility_date = "2024-09-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[env.dev]
name = "wize-ai-studio-dev"

[env.dev.vars]
ENVIRONMENT = "development"

[env.production]
name = "wize-ai-studio-prod"

[env.production.vars]
ENVIRONMENT = "production"

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "wize-ai-studio-db"
primary_key = "id"
