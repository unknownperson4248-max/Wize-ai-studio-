# Builds the NOVA Android app online on every change to android/, and publishes the APK as the
# "nova-latest" release, so it can be downloaded and installed straight from the phone.
name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk nova.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: nova.apk

      - name: Remove the previous APK from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset nova-latest nova.apk -y -R "${{ github.repository }}" || true

      - name: Publish as the "nova-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-latest
          name: NOVA (latest build)
          prerelease: true
          make_latest: false
          body: |
            Latest NOVA app, built from `${{ github.ref_name }}` at ${{ github.sha }}.
            On the phone: download **nova.apk** below, open it, allow "install unknown apps" for your browser once, then install.
          files: nova.apk
